<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Playables Launcher</title>

<style>
    body {
        margin: 0;
        background: #0a0a0a;
        color: #e0e0e0;
        font-family: Arial, sans-serif;
    }

    header {
        padding: 20px;
        text-align: center;
        background: #111;
        border-bottom: 3px solid #b00000;
        font-size: 32px;
        font-weight: bold;
        letter-spacing: 2px;
    }

    #grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 20px;
        padding: 30px;
    }

    .tile {
        background: #151515;
        border: 2px solid #b00000;
        border-radius: 10px;
        padding: 20px;
        text-align: center;
        cursor: pointer;
        transition: 0.2s;
        font-size: 20px;
        font-weight: bold;
        text-decoration: none;
        color: #e0e0e0;
    }

    .tile:hover {
        background: #1f1f1f;
        transform: scale(1.05);
        border-color: #ff1a1a;
    }
</style>
</head>
<body>

<header>PLAYABLES</header>

<div id="grid">

    <!-- ===========================================================
         HOW TO ADD NEW PLAYABLES
         -----------------------------------------------------------
         GitHub Pages blocks folder scanning, so list your playables
         manually here. Offline caching will be automatic.

         Example:
         <a class="tile" href="playables/stacktris/index.html">stacktris</a>
         <a class="tile" href="playables/stickmanhook/index.html">stickmanhook</a>
        =========================================================== -->

    <!-- Add your playables here -->
    <a class="tile" href="playables/stacktris/index.html">stacktris</a>
    <a class="tile" href="playables/stickmanhook/index.html">stickmanhook</a>

</div>

<script>
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(console.error);
}
</script>

</body>
</html>
