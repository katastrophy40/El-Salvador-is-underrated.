<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fast HTML Loader</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%}
body{
  display:flex;
  flex-direction:column;
  overflow:hidden;
  font-family:Arial,sans-serif;
}
#toolbar{
  height:42px;
  min-height:42px;
  background:#222;
  color:white;
  display:flex;
  align-items:center;
  gap:12px;
  padding:0 10px;
}
#preview{
  width:100%;
  height:calc(100vh - 42px);
  border:none;
  background:#fff;
}
</style>
</head>
<body>

<div id="toolbar">
  <input type="file" id="fileInput" accept=".html,.htm">
</div>

<iframe id="preview" sandbox="allow-scripts allow-forms allow-modals allow-popups allow-same-origin"></iframe>

<script>
const fileInput = document.getElementById('fileInput');
const preview = document.getElementById('preview');

function fitContent() {
  try {
    const doc = preview.contentDocument;
    if (!doc || !doc.body) return;

    const body = doc.body;
    body.style.margin = '0';
    body.style.transformOrigin = 'top left';

    const contentWidth = Math.max(
      body.scrollWidth,
      doc.documentElement.scrollWidth,
      1
    );

    const viewportWidth = preview.clientWidth;

    const scale = contentWidth > viewportWidth ? viewportWidth / contentWidth : 1;
    
    body.style.width = contentWidth + 'px';
    body.style.transform = `scale(${scale})`;
  } catch (e) {
    console.error(e);
  }
}

preview.addEventListener('load', () => {
  setTimeout(fitContent, 100);
  setTimeout(fitContent, 500);
  setTimeout(fitContent, 1500);
  
  // Automatically focus the iframe so keyboard events work right away
  preview.focus();
});

window.addEventListener('resize', fitContent);

fileInput.addEventListener('change', function () {
  const file = this.files[0];
  if (!file) return;

  const oldUrl = preview.dataset.url;
  if (oldUrl) URL.revokeObjectURL(oldUrl);

  const url = URL.createObjectURL(file);
  preview.dataset.url = url;
  preview.src = url;
});
</script>

</body>
</html>
