<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>russia is the italy place</title>

    <style>
        * { box-sizing: border-box; }

        html, body { height: 100%; }

        body {
            margin: 0;
            background: #0a0a0a;
            color: #e0e0e0;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        header {
            padding: 20px;
            text-align: center;
            background: #111;
            border-bottom: 3px solid #b00000;
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .instructions {
            color: #888;
            font-size: 14px;
            padding: 15px 30px 5px 30px;
            text-align: center;
        }

        .view-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Grid view */
        #grid-view {
            display: flex;
            flex-direction: column;
            flex: 1;
            padding: 20px 30px 40px 30px;
        }

        #grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .tile {
            background: #151515;
            border: 2px solid #b00000;
            border-radius: 8px;
            padding: 25px 20px;
            text-align: center;
            font-family: inherit;
            font-size: 20px;
            font-weight: bold;
            color: #e0e0e0;
            transition: background 0.15s ease, border-color 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .tile:hover,
        .tile:focus-visible {
            background: #1f1f1f;
            border-color: #ff1a1a;
            outline: none;
        }

        /* Game view */
        #game-view {
            display: none;
            flex-direction: column;
            flex: 1;
            padding: 20px 30px 40px 30px;
            width: 100%;
        }

        .game-nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            padding: 10px 18px;
            background: #151515;
            border: 2px solid #b00000;
            border-radius: 8px;
            color: #e0e0e0;
            font-family: inherit;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.15s ease, border-color 0.15s ease;
        }

        .back-btn:hover,
        .back-btn:focus-visible {
            background: #1f1f1f;
            border-color: #ff1a1a;
            outline: none;
        }

        .game-title-indicator {
            font-size: 20px;
            font-weight: bold;
            color: #e0e0e0;
        }

        .iframe-container-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            flex: 1;
        }

        /* Keeps a true 16:10 shape even when the height cap kicks in:
           width is limited to 75vh * 1.6 so aspect-ratio is never overridden. */
        .iframe-wrapper {
            position: relative;
            width: min(100%, calc(75vh * 1.6));
            aspect-ratio: 16 / 10;
            background: #111;
            border: 2px solid #b00000;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
        }

        iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
            background: #0a0a0a;
        }

        footer {
            padding: 15px;
            text-align: center;
            font-size: 12px;
            color: #555;
            border-top: 1px solid #151515;
            background: #0a0a0a;
        }

        @media (max-width: 600px) {
            header { font-size: 22px; }
            #grid-view, #game-view { padding: 15px; }
        }
    </style>
</head>
<body>

    <header>russia is the italy place</header>

    <div class="instructions">
        Click any game tile below to load and play directly inside the page without new tabs.<br>
        Optimized for Chromebooks and all devices with fixed proportions.
    </div>

    <div class="view-container">
        <div id="grid-view">
            <div id="grid">
                <!-- Add or remove game tiles here: data-src is the file path, data-title is the display name -->
                <button type="button" class="tile" data-src="playables/googlebaseball.html" data-title="Google Baseball">Google Baseball</button>
                <button type="button" class="tile" data-src="playables/stickmanhook/index.html" data-title="Stickman Hook">Stickman Hook</button>
            </div>
        </div>

        <div id="game-view">
            <div class="game-nav-bar">
                <button type="button" class="back-btn" id="back-btn">← Back to Launcher</button>
                <div class="game-title-indicator" id="active-game-title"></div>
            </div>
            <div class="iframe-container-wrapper">
                <div class="iframe-wrapper">
                    <iframe id="game-frame" src="about:blank" title="Game"
                            allowfullscreen
                            allow="fullscreen; autoplay; gamepad"
                            sandbox="allow-scripts allow-same-origin allow-pointer-lock allow-forms allow-modals allow-popups allow-downloads"></iframe>
                </div>
            </div>
        </div>
    </div>

    <footer>
        russia is the italy place &bull; Proportional In-Page Frame Edition
    </footer>

    <script>
        const gridView = document.getElementById('grid-view');
        const gameView = document.getElementById('game-view');
        const gameFrame = document.getElementById('game-frame');
        const titleIndicator = document.getElementById('active-game-title');

        function loadGame(url, title) {
            titleIndicator.textContent = title;
            gameFrame.src = url;

            gridView.style.display = 'none';
            gameView.style.display = 'flex';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function returnToGrid() {
            // about:blank (not '') so the iframe never reloads this page; also stops game audio/loops
            gameFrame.src = 'about:blank';

            gameView.style.display = 'none';
            gridView.style.display = 'flex';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        document.querySelectorAll('.tile').forEach(tile => {
            tile.addEventListener('click', () => loadGame(tile.dataset.src, tile.dataset.title));
        });

        document.getElementById('back-btn').addEventListener('click', returnToGrid);

        // Esc returns to the launcher (only when the page itself has focus, not inside the game)
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape' && gameView.style.display === 'flex') returnToGrid();
        });
    </script>

</body>
</html>
