<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>russia is the italy place</title>

    <style>
        body {
            margin: 0;
            background: #0a0a0a;
            color: #e0e0e0;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 20px;
            text-align: center;
            background: #111;
            border-bottom: 3px solid #b00000;
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .instructions {
            color: #888;
            font-size: 14px;
            padding: 15px 30px 5px 30px;
        }

        /* Back arrow style using history.back() for reliable navigation across folders */
        .back-arrow {
            display: inline-block;
            padding: 10px 15px;
            margin: 10px 30px;
            background: #151515;
            border: 2px solid #b00000;
            border-radius: 8px;
            color: #e0e0e0;
            font-weight: bold;
            text-decoration: none;
            font-size: 18px;
            cursor: pointer;
            width: fit-content;
        }
        .back-arrow:hover {
            background: #1f1f1f;
            border-color: #ff1a1a;
        }

        #grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            padding: 20px 30px 40px 30px;
            flex: 1;
        }

        .tile {
            background: #151515;
            border: 2px solid #b00000;
            border-radius: 8px;
            padding: 25px 20px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            text-decoration: none;
            color: #e0e0e0;
            transition: background 0.15s ease, border-color 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tile:hover {
            background: #1f1f1f;
            border-color: #ff1a1a;
        }

        footer {
            padding: 15px;
            text-align: center;
            font-size: 12px;
            color: #555;
            border-top: 1px solid #151515;
        }
    </style>
</head>
<body>

    <header>russia is the italy place</header>

    <div class="instructions">
        Click a game to open it in a new tab.<br>
        Use the ← Back button to return here.
    </div>

    <!-- Back arrow for launcher using history API to prevent broken 404 paths -->
    <a class="back-arrow" href="javascript:history.back()">← Back</a>

    <div id="grid">
        <!-- SAMPLE PLAYABLES -->
        <a class="tile" href="playables/googlebaseball.html" target="_blank" rel="noopener">Google Baseball</a>
        <a class="tile" href="playables/stickmanhook/index.html" target="_blank" rel="noopener">stickmanhook</a>
    </div>

    <footer>
        russia is the italy place &bull; Flat Dark Edition
    </footer>

</body>
</html>
