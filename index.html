<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>russia is the italy place</title>

    <style>
        body {
            margin: 0;
            background: #0a0a0a;
            color: #e0e0e0;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        header {
            padding: 20px;
            text-align: center;
            background: #111;
            border-bottom: 3px solid #b00000;
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .instructions {
            color: #888;
            font-size: 14px;
            padding: 15px 30px 5px 30px;
            text-align: center;
        }

        /* Views management container */
        .view-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            box-sizing: border-box;
        }

        /* Grid view layout */
        #grid-view {
            display: flex;
            flex-direction: column;
            flex: 1;
            padding: 20px 30px 40px 30px;
        }

        #grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .tile {
            background: #151515;
            border: 2px solid #b00000;
            border-radius: 8px;
            padding: 25px 20px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            text-decoration: none;
            color: #e0e0e0;
            transition: background 0.15s ease, border-color 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .tile:hover {
            background: #1f1f1f;
            border-color: #ff1a1a;
        }

        #game-view {
            display: none;
            flex-direction: column;
            flex: 1;
            padding: 20px 30px 40px 30px;
            width: 100%;
            box-sizing: border-box;
        }

        .game-nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            padding: 10px 18px;
            background: #151515;
            border: 2px solid #b00000;
            border-radius: 8px;
            color: #e0e0e0;
            font-weight: bold;
            text-decoration: none;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.15s ease, border-color 0.15s ease;
        }

        .back-btn:hover {
            background: #1f1f1f;
            border-color: #ff1a1a;
        }

        .game-title-indicator {
            font-size: 20px;
            font-weight: bold;
            color: #e0e0e0;
        }

        /* Proper proportional 16:9 responsive wrapper with max constraints */
        .iframe-container-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            flex: 1;
        }

        .iframe-wrapper {
            position: relative;
            width: 100%;
            max-width: 1100px;
            aspect-ratio: 16 / 10;
            max-height: 75vh;
            background: #111;
            border: 2px solid #b00000;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
        }

        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            background: #0a0a0a;
        }

        footer {
            padding: 15px;
            text-align: center;
            font-size: 12px;
            color: #555;
            border-top: 1px solid #151515;
            background: #0a0a0a;
        }
    </style>
</head>
<body>

    <header>russia is the italy place</header>

    <div class="instructions">
        Click any game tile below to load and play directly inside the page without new tabs.<br>
        Optimized for Chromebooks and all devices with fixed proportions.
    </div>

    <div class="view-container">
        <div id="grid-view">
            <div id="grid">
                <!-- SAMPLE PLAYABLES: Add or remove game tiles here -->
                <a class="tile" onclick="loadGame('playables/googlebaseball.html', 'Google Baseball')">Google Baseball</a>
                <a class="tile" onclick="loadGame('playables/stickmanhook/index.html', 'Stickman Hook')">stickmanhook</a>
            </div>
        </div>

        <div id="game-view">
            <div class="game-nav-bar">
                <button class="back-btn" onclick="returnToGrid()">← Back to Launcher</button>
                <div class="game-title-indicator" id="active-game-title">Game Loading...</div>
            </div>
            <div class="iframe-container-wrapper">
                <div class="iframe-wrapper">
                    <iframe id="game-frame" src="" allowfullscreen sandbox="allow-scripts allow-same-origin allow-pointer-lock allow-forms"></iframe>
                </div>
            </div>
        </div>
    </div>

    <script>
        function loadGame(url, title) {
            const gridView = document.getElementById('grid-view');
            const gameView = document.getElementById('game-view');
            const gameFrame = document.getElementById('game-frame');
            const titleIndicator = document.getElementById('active-game-title');

            // Set title and frame source
            titleIndicator.textContent = title;
            gameFrame.src = url;

            // Switch views
            gridView.style.display = 'none';
            gameView.style.display = 'flex';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function returnToGrid() {
            const gridView = document.getElementById('grid-view');
            const gameView = document.getElementById('game-view');
            const gameFrame = document.getElementById('game-frame');

            // Clear iframe src to stop background audio/game loops
            gameFrame.src = '';

            // Switch views back
            gameView.style.display = 'none';
            gridView.style.display = 'flex';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>

    <footer>
        russia is the italy place &bull; Proportional In-Page Frame Edition
    </footer>

</body>
</html>
