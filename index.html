<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>stop asking me to fix this</title>

<style>
    body {
        margin: 0;
        background: #0a0a0a;
        color: #e0e0e0;
        font-family: Arial, sans-serif;
    }

    header {
        padding: 20px;
        text-align: center;
        background: #111;
        border-bottom: 3px solid #b00000;
        font-size: 32px;
        font-weight: bold;
        letter-spacing: 2px;
    }

    #grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 20px;
        padding: 30px;
    }

    .tile {
        background: #151515;
        border: 2px solid #b00000;
        border-radius: 10px;
        padding: 20px;
        text-align: center;
        font-size: 20px;
        font-weight: bold;
        text-decoration: none;
        color: #e0e0e0;
        transition: 0.2s;
    }

    .tile:hover {
        background: #1f1f1f;
        transform: scale(1.05);
        border-color: #ff1a1a;
    }

    .instructions {
        color: #888;
        font-size: 14px;
        padding: 10px 30px;
    }

    /* BACK ARROW ADDON */
    .back-arrow {
        display:inline-block;
        padding:10px 15px;
        margin:10px;
        background:#151515;
        border:2px solid #b00000;
        border-radius:8px;
        color:#e0e0e0;
        font-weight:bold;
        text-decoration:none;
        font-size:18px;
    }
    .back-arrow:hover {
        background:#1f1f1f;
        border-color:#ff1a1a;
    }
</style>
</head>
<body>

<header>russia is the italy place</header>

<!-- Back arrow for launcher (optional) -->
<a class="back-arrow" href="index.html">← Back</a>

<div class="instructions">
    <!-- ===========================================================
         HOW TO ADD NEW PLAYABLES (HTML ONLY)
         -----------------------------------------------------------
         GitHub Pages blocks folder scanning, so add tiles manually.

         1. Put your playable in:
                playables/NAME.html
                or
                playables/NAME/index.html

         2. Add a tile below:
                <a class="tile" href="playables/NAME.html">NAME</a>

         3. Inside each playable, add:
                <a class="back-arrow" href="../index.html">← Back</a>

        =========================================================== -->
</div>

<div id="grid">

    <!-- SAMPLE PLAYABLES -->
    <a class="tile" href="playables/googlebaseball.html">Google Baseball</a>
    <a class="tile" href="playables/stickmanhook/index.html">stickmanhook</a>

    <!-- ADD YOUR OWN BELOW -->
    <a class="tile" href="playables/googlebaseball.html">Google Baseball</a>

</div>

</body>
</html>
