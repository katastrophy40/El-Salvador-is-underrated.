<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>stop asking me to fix this</title>

<style>
    body {
        margin: 0;
        background: #0a0a0a;
        color: #e0e0e0;
        font-family: Arial, sans-serif;
        display: flex;
        flex-direction: column;
        height: 100vh;
    }

    header {
        padding: 20px;
        text-align: center;
        background: #111;
        border-bottom: 3px solid #b00000;
        font-size: 32px;
        font-weight: bold;
        letter-spacing: 2px;
    }

    #grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 20px;
        padding: 30px;
        flex: 1;
        overflow-y: auto;
    }

    .tile {
        background: #151515;
        border: 2px solid #b00000;
        border-radius: 10px;
        padding: 20px;
        text-align: center;
        font-size: 20px;
        font-weight: bold;
        text-decoration: none;
        color: #e0e0e0;
        transition: 0.2s;
        cursor: pointer;
    }

    .tile:hover {
        background: #1f1f1f;
        transform: scale(1.05);
        border-color: #ff1a1a;
    }

    /* iframe container */
    #player {
        display: none;
        flex: 1;
        border: none;
        width: 100%;
        background: #000;
    }

    /* back arrow */
    #back {
        display: none;
        padding: 10px 15px;
        background: #151515;
        border: 2px solid #b00000;
        border-radius: 8px;
        color: #e0e0e0;
        font-weight: bold;
        font-size: 18px;
        text-decoration: none;
        margin: 10px;
        width: fit-content;
        cursor: pointer;
    }
    #back:hover {
        background:#1f1f1f;
        border-color:#ff1a1a;
    }
</style>
</head>
<body>

<header>russia is the italy place</header>

<!-- Back button -->
<div id="back" onclick="exitGame()">← Back</div>

<!-- Game selection -->
<div id="grid">
    <a class="tile" onclick="play('playables/googlebaseball.html')">Google Baseball</a>
    <a class="tile" onclick="play('playables/stickmanhook/index.html')">stickmanhook</a>
</div>

<!-- Game iframe -->
<iframe id="player"></iframe>

<script>
function play(url) {
    document.getElementById("grid").style.display = "none";
    document.getElementById("back").style.display = "inline-block";
    const frame = document.getElementById("player");
    frame.src = url;
    frame.style.display = "block";
}

function exitGame() {
    const frame = document.getElementById("player");
    frame.src = "";
    frame.style.display = "none";
    document.getElementById("back").style.display = "none";
    document.getElementById("grid").style.display = "grid";
}
</script>

</body>
</html>
