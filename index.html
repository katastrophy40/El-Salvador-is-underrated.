<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fast HTML Loader</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%}
body{
  display:flex;
  flex-direction:column;
  overflow:hidden;
  font-family:Arial,sans-serif;
}
#toolbar{
  height:42px;
  min-height:42px;
  background:#222;
  color:white;
  display:flex;
  align-items:center;
  gap:10px;
  padding:0 10px;
}
.btn-drive {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background-color: #333;
  color: #fff;
  border: 1px solid #555;
  border-radius: 4px;
  padding: 4px 10px;
  font-size: 13px;
  cursor: pointer;
  text-decoration: none;
  transition: background 0.2s, border-color 0.2s;
  white-space: nowrap;
}
.btn-drive:hover {
  background-color: #444;
  border-color: #777;
}
.drive-icon {
  width: 16px;
  height: 16px;
  flex-shrink: 0;
}
#preview{
  width:100%;
  height:calc(100vh - 42px);
  border:none;
  background:#fff;
}
</style>
</head>
<body>

<div id="toolbar">
  <!-- Instant Google Drive Folder Download Button -->
  <a href="YOUR_GOOGLE_DRIVE_FOLDER_LINK_HERE" id="downloadFolderBtn" class="btn-drive" title="Download Google Drive Folder">
    <svg class="" viewBox="0 0 87.3 78.8">
      <path fill="#FFC107" d="M6.6 66.85l25.3-43.8 28.3 48.9H12.2z"/>
      <path fill="#0066DA" d="M43.65 0L87.3 75.6H57.2L28.65 25.8z"/>
      <path fill="#00AC47" d="M73.55 78.8H13.75L0 55l28.65-49.6h29.8z"/>
      <path fill="#0066DA" d="M28.65 25.8L13.75 51.6 0 55l28.65-49.6z"/>
    </svg>
    Folder
  </a>

  <span style="color:#555">|</span>

  <input type="file" id="fileInput" accept=".html,.htm">
</div>

<iframe id="preview" sandbox="allow-scripts allow-forms allow-modals allow-popups allow-same-origin"></iframe>

<script>
const fileInput = document.getElementById('fileInput');
const preview = document.getElementById('preview');
const downloadFolderBtn = document.getElementById('downloadFolderBtn');

// PASTE YOUR SPECIFIC DRIVE FOLDER LINK HERE:
const folderLink = "https://drive.google.com/drive/folders/1keTOUB0r2UwxQabkpsvovTt1eivOEYN-?usp=drive_link";

// Automatically formats the link so it forces a direct download sequence when clicked
if (folderLink && !folderLink.includes("YOUR_FOLDER_ID_HERE")) {
  // If it's a standard web view link, convert it or keep it open in a background trigger
  downloadFolderBtn.href = folderLink;
  downloadFolderBtn.setAttribute('target', '_blank');
  downloadFolderBtn.setAttribute('rel', 'noopener noreferrer');
}

function fitContent() {
  try {
    const doc = preview.contentDocument;
    if (!doc || !doc.body) return;

    const body = doc.body;
    body.style.margin = '0';
    body.style.transformOrigin = 'top left';

    const contentWidth = Math.max(
      body.scrollWidth,
      doc.documentElement.scrollWidth,
      1
    );

    const viewportWidth = preview.clientWidth;

    const scale = contentWidth > viewportWidth ? viewportWidth / contentWidth : 1;
    
    body.style.width = contentWidth + 'px';
    body.style.transform = `scale(${scale})`;
  } catch (e) {
    console.error(e);
  }
}

preview.addEventListener('load', () => {
  setTimeout(fitContent, 100);
  setTimeout(fitContent, 500);
  setTimeout(fitContent, 1500);
  
  preview.focus();
});

window.addEventListener('resize', fitContent);

fileInput.addEventListener('change', function () {
  const file = this.files[0];
  if (!file) return;

  const oldUrl = preview.dataset.url;
  if (oldUrl) URL.revokeObjectURL(oldUrl);

  const url = URL.createObjectURL(file);
  preview.dataset.url = url;
  preview.src = url;
});
</script>

</body>
</html>
